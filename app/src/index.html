<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8"/>
  <title>Venite</title>


  <base href="/"/>

  <meta name="color-scheme" content="light dark"/>
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="format-detection" content="telephone=no"/>
  <meta name="msapplication-tap-highlight" content="no"/>

  <!-- Favicon V from https://books.google.com/books?id=TbtCAAAAYAAJ&pg=PP94#v=onepage&q&f=false -->
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icon/apple-touch-icon.png">
  <link rel="mask-icon" href="assets/icon/safari-pinned-tab.svg" color="#5bbad5">
  <link rel="shortcut icon" href="assets/icon/favicon.ico">
  <meta name="msapplication-TileColor" content="#2b5797">
  <meta name="msapplication-config" content="assets/icon/browserconfig.xml">
  <meta name="theme-color" content="#ffffff">

  <!-- add to homescreen for ios -->
  <meta name="apple-mobile-web-app-capable" content="yes"/>

  <link rel="icon" type="image/png" href="assets/icon/favicon.png"/>
  <meta name="theme-color" content="#1976d2">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1976d2">

  <!-- ExsurgeChar font — needs a document-global @font-face so Exsurge can
       measure glyph metrics when laying out chant. A component-scoped
       @font-face in Stencil scss is not visible to Exsurge's runtime font
       lookups, so it stalls in performLayoutAsync's hyphenWidth check. -->
  <style>
    @font-face {
      font-family: 'Exsurge Characters';
      src: url('/offline/chant/fonts/ExsurgeChar.otf') format('opentype');
      font-display: block;
    }
  </style>
</head>

<body>
  <venite-root></venite-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
  <!-- Exsurge is loaded as a global script (UMD) because Stencil cannot
       resolve a bare `import('exsurge')` at component-build time and the
       browser cannot resolve the specifier at runtime. Attaches to
       `window.exsurge`, consumed by `<ldf-chant-notation>`. -->
  <script src="/offline/chant/exsurge.min.js" defer></script>
</body>
